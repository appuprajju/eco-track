version: '3.8'

services:
  api:
    build:
      context: ./backend  # 1. FIXED: Pointed to the backend folder explicitly if running from root
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:plantTealGreen@postgres_db:5432/ecotrack_db
      - REDIS_URL=redis://redis_cache:6379
      - JWT_SECRET=super_secret_organic_key
      - REFRESH_SECRET=refresh_clean_air_vortex
    depends_on:
      postgres_db:
        condition: service_healthy # 2. FIXED: Wait for database to fully accept connections
      redis_cache:
        condition: service_started
    restart: always

  postgres_db:
    image: postgres:15-alpine
    container_name: ecotrack_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=plantTealGreen
      - POSTGRES_DB=ecotrack_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql # 3. FIXED: Adjusted relative path
    # Health check ensuring database is ready before API launches
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecotrack_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis_cache:
    image: redis:7-alpine
    container_name: ecotrack_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data: