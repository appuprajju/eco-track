name: EcoTrack AI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Required to allow GitHub to request the OIDC token from Google Cloud
permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  # 1. Android Native Build Pipeline
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Android App Compilation (Debug Apk)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecotrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # 2. Node.js Backend API Pipeline & Deployment
  backend-deploy:
    runs-on: ubuntu-latest
    needs: android-build
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      # --- SECURE DEPLOYMENT TO GOOGLE CLOUD RUN ---
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: 'projects/177858659456/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@ecotrack-499113.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy ecotrack-backend \
            --source ./backend \
            --region us-central1 \
            --allow-unauthenticated \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --set-env-vars="PORT=8080,JWT_SECRET=${{ secrets.JWT_SECRET }},REFRESH_SECRET=${{ secrets.REFRESH_SECRET }}"